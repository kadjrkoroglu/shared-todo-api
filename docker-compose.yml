services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sharedtodo
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres@db:5432/sharedtodo?schema=public
      JWT_SECRET: supersecretkey123
    depends_on:
      - db

volumes:
  postgres_data:
